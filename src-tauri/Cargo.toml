[package]
name = "nxy-ascua"
version = "0.1.0"
description = "Ascua, a little candle that lives on your screen and watches your Claude Code sessions"
authors = ["Mati"]
license = "Apache-2.0"
edition = "2024"

[lib]
# The `_lib` suffix is needed to keep the lib name unique from the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "nxy_ascua_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = "2"
ascua-ipc = { path = "../ipc" }
