<!doctype html>
<html lang="en" data-theme="neon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ascua</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <section id="bubble" hidden>
      <header>
        <span id="face"></span>
        <span id="tool"></span>
        <span id="queued"></span>
      </header>
      <pre id="summary"></pre>
      <footer>
        <button data-decision="allow" class="allow">Approve</button>
        <button data-decision="deny" class="deny">Reject</button>
        <button data-decision="terminal" class="quiet">In terminal</button>
      </footer>
    </section>

    <section id="room" hidden>
      <header id="room-bar">
        <span>Ascua</span>
        <span class="room-buttons">
          <button id="room-max" class="quiet" aria-label="Maximize">&#x25A1;</button>
          <button id="room-close" class="quiet" aria-label="Close">&#x2715;</button>
        </span>
      </header>
      <main>
        <h1>Hello user!</h1>
      </main>
    </section>

    <div id="ascua-host"></div>
  </body>
</html>
